name: "CodeQL"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to the Security tab

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: go
        # Go is analyzed without a build step (build-mode "none" is the
        # default for Go), so no autobuild step is needed.

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
